- id: cer_electricity_trade
  name: Canada Energy Regulator electricity trade summary
  publisher: Canada Energy Regulator
  authority_tier: 1
  adapter: cer_electricity_trade
  enabled: true
  optional: true
  required: false
  publish_enabled: true
  update_cadence: monthly
  source_url: https://www.cer-rec.gc.ca/en/data-analysis/energy-commodities/electricity/statistics/electricity-trade-summary/
  download_url: https://www.cer-rec.gc.ca/en/data-analysis/energy-commodities/electricity/statistics/electricity-trade-summary/electricity-trades-summary-resume-echanges-commerciaux-electricite.xlsx
  license_name: Open Government Licence - Canada
  raw_redistribution_allowed: true
  start_date: '2010-01-01'
  collection_stale_after_days: 45
  stale_after_days: 120
  monthly_trade_series:
  - source_series_id: canada_exports_mwh
    variable_id: reliability.electricity_trade.canada_exports_mwh
    header_patterns: ['^Exports.*MW\.h']
    unit_original: MWh
    unit_canonical: MWh
    geography_id: CA
  - source_series_id: canada_imports_mwh
    variable_id: reliability.electricity_trade.canada_imports_mwh
    header_patterns: ['^Imports.*MW\.h']
    unit_original: MWh
    unit_canonical: MWh
    geography_id: CA
  - source_series_id: canada_export_value_cad
    variable_id: reliability.electricity_trade.canada_export_value_cad
    header_patterns: ['^Exports.*\(\$\)']
    unit_original: CAD
    unit_canonical: CAD
    currency: CAD
    geography_id: CA
  - source_series_id: canada_import_value_cad
    variable_id: reliability.electricity_trade.canada_import_value_cad
    header_patterns: ['^Imports.*\(\$\)']
    unit_original: CAD
    unit_canonical: CAD
    currency: CAD
    geography_id: CA
  monthly_price_series:
  - source_series_id: west_export_price_cad_per_mwh
    variable_id: reliability.electricity_trade.west_export_price_cad_per_mwh
    header_patterns: ['Exports from Canada.*West.*\$/MW\.h']
    unit_original: CAD_per_MWh
    unit_canonical: CAD_per_MWh
    currency: CAD
    geography_id: CA-WEST
  - source_series_id: west_import_price_cad_per_mwh
    variable_id: reliability.electricity_trade.west_import_price_cad_per_mwh
    header_patterns: ['Imports to Canada.*West.*\$/MW\.h']
    unit_original: CAD_per_MWh
    unit_canonical: CAD_per_MWh
    currency: CAD
    geography_id: CA-WEST
