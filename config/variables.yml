  phase: 1
  expected_min: 1000000
  expected_max: 5000000
- id: economic.households.growth_yoy_pct
  class: Economic
  name: Household growth
  description: Percentage change in the estimated or projected number of private households from the preceding year.
  canonical_unit: percent
  geography_id: CA-BC
  status: ready
  phase: 1
  expected_min: -5
  expected_max: 10
