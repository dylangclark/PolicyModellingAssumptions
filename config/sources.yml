- id: nrcan_energy_use_database
  name: NRCan National and Comprehensive Energy Use Databases
  publisher: Natural Resources Canada
  authority_tier: 1
  adapter: nrcan_neud
  enabled: true
  optional: true
  required: false
  publish_enabled: true
  update_cadence: annual
  source_url: https://oee.nrcan.gc.ca/corporate/statistics/neud/dpa/data_e/databases.cfm
  license_name: Open Government Licence - Canada
  raw_redistribution_allowed: true
  collection_stale_after_days: 500
  stale_after_days: 500
  tables:
  - table_id: residential_bc_heating_system_stock_21
    title: Residential Sector British Columbia Table 21 - Heating System Stock
    url: https://oee.nrcan.gc.ca/corporate/statistics/neud/dpa/showTable.cfm?juris=bc&page=0&rn=21&sector=res&type=CP&year=2023
    geography_id: CA-BC
    source_year_parameter: 2023
    series:
    - source_series_id: heat_pump_stock
      variable_id: electrification.residential_heating_systems.heat_pump_stock
      row_pattern: '^Heat Pump$'
      occurrence: 1
      multiplier: 1000
      unit_original: thousand_systems
      unit_canonical: systems
    - source_series_id: heat_pump_share_pct
      variable_id: electrification.residential_heating_systems.heat_pump_share_pct
      row_pattern: '^Heat Pump$'
      occurrence: 2
      unit_original: percent
      unit_canonical: percent
    - source_series_id: electric_stock
      variable_id: electrification.residential_heating_systems.electric_stock
      row_pattern: '^Electric$'
      occurrence: 1
      multiplier: 1000
      unit_original: thousand_systems
      unit_canonical: systems
