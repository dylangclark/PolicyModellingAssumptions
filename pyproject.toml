[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bc-assumptions-registry"
version = "0.1.1"
description = "Versioned evidence registry for economic and energy-policy assumptions used in British Columbia"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "BC Assumptions Registry contributors"}]
dependencies = [
  "requests>=2.31,<3",
  "PyYAML>=6,<7",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
regulatory = ["pypdf>=5,<7"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
bc-assumptions = "bc_assumptions.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
