name: Test registry

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'site/data/**'
      - 'data/export/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev,regulatory]'
      - run: ruff check .
      - run: pytest
      - run: bc-assumptions --root . validate-config
      - run: bc-assumptions --root . validate-public
